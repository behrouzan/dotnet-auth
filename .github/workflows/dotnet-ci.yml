name: .NET CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Behrouzan.Auth.sln

      - name: Build
        run: dotnet build Behrouzan.Auth.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Behrouzan.Auth.sln --configuration Release --no-build --no-restore
